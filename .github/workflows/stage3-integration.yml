name: Stage 3 team integration

on:
  push:
    branches: [main, Dev, codex/stage3-team-integration]
    paths:
      - 'implementations/*/stage3/**'
      - 'provenance*.json'
      - 'script/integration/**'
      - 'tests/integration/**'
      - '.github/workflows/**'
      - 'requirements.txt'
  pull_request:
    branches: [main, Dev]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'implementations/*/stage3/**'
      - 'provenance*.json'
      - 'script/integration/**'
      - 'tests/integration/**'
      - '.github/workflows/**'
      - 'requirements.txt'

permissions:
  contents: read

concurrency:
  group: stage3-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify_stage3:
    name: Preserve and test all four Stage 3 implementations
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Verify Stage 2 and Stage 3 source snapshots
        run: |
          python script/integration/verify_sources.py --check-history
          python script/integration/verify_sources.py --manifest provenance_stage3.json --check-history
      - name: Install CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.14.1'
          python -m pip install -r requirements.txt
      - name: Test Hongzhe Stage 3 implementation
        working-directory: implementations/hongzhe/stage3
        run: python -m unittest discover -s tests/stage3 -p 'test_*.py' -v
      - name: Test Zizheng Stage 3 implementation
        working-directory: implementations/zizheng/stage3
        run: python -m unittest discover -s tests -p 'test_stage3.py' -v
      - name: Smoke-test Xiaoyu and Aileen Stage 3 implementations
        run: python tests/integration/smoke_stage3.py
      - name: Verify Stage 2 snapshots remain unchanged
        if: always()
        run: python script/integration/verify_sources.py --check-history
      - name: Verify Stage 3 snapshots remain unchanged
        if: always()
        run: python script/integration/verify_sources.py --manifest provenance_stage3.json --check-history
